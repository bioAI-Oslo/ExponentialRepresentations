repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: debug-statements
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000'] # Bump from 500kB to 5MB; the tracked fits are 1-2 MB
        exclude: ^data/ca1_events\.npz$ # 55 MB, the one deliberate exception

  - repo: https://github.com/astral-sh/uv-pre-commit
    # Ensure uv.lock file is up to date
    rev: 0.9.24
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      # Run the linter (fixes imports and logic)
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      # Runs the project's own pyright so the hook and `uv run pyright` agree
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]
