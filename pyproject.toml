[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "expmap"
version = "0.1.0"
description = "Generating interpretable neural spatial representations using the matrix exponential."
keywords = [
    "neuroscience",
    "spatial-navigation",
    "grid-cells",
    "matrix-exponential",
    "path-integration",
]
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "scipy>=1.12",
    "torch>=2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "notebook>=7.5",
    "pre-commit>=4.5",
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "C4"]
# N802/N803/N806/N812 are off so the mathematical names match the paper: R, Gx,
# Q, Sigma. N802 covers `Gx`/`Gy` exposed as properties in `fitting.py`.
ignore = ["N812", "N806", "N803", "N802", "NPY002"]
exclude = ["notebooks"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/test_imports.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
